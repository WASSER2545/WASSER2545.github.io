{% if site.related_posts.size > 0 %}
  <aside class="article-related" aria-label="Related articles">
    <h2>Keep reading</h2>
    <ul>
      {% for post in site.related_posts limit: site.related_blog_posts.max_related %}
        <li><a href="{{ post.url | relative_url }}">{{ post.title }} <span aria-hidden="true">→</span></a></li>
      {% endfor %}
    </ul>
  </aside>
{% endif %}
